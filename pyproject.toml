[project]
name = "lemma"
version = "0.1.0"
description = "Local-only practice app for staff-level system design interviews"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pyyaml",
]

[project.optional-dependencies]
# Apple Silicon only; imported lazily so tests run without it.
whisper = ["mlx-whisper"]
# Natural-sounding read-aloud voice; also needs `brew install espeak-ng`. Without it the UI uses the browser's voices.
tts = ["kokoro-onnx"]
desktop = ["pywebview"]
dev = ["ruff", "httpx2"]  # httpx2 is required by starlette.testclient

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E402", "E702", "E731"]
