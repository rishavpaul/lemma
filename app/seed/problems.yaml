# The coding roadmap: 160 problems in 19 phases (core patterns, then practical rounds) plus 5 multi-level builds.
topics: {hash: Hash map / set, ll: Linked list, stack: Stack, mono: Monotonic stack, queue: Queue / deque, heap: Heap / priority queue, ordered: Sorted
    set / ordered map, bsearch: Binary search, trie: Trie, prefix: Prefix sums, segtree: Segment tree / Fenwick, intervals: Intervals / sweep
    line, twoptr: Two pointers, window: Sliding window, tree: Trees, bfs: BFS, dfs: DFS, topo: Topological sort, uf: Union-find, dijkstra: Dijkstra
    / shortest path, dp: Dynamic programming, backtrack: Backtracking, greedy: Greedy, bits: Bit manipulation, math: Math / combinatorics, parse: Parsing,
  sim: Simulation, conc: Concurrency}
phases:
- {num: 1, track: core, name: 'Arrays, hashing and two pointers', why: The most common patterns in classic rounds. A hash lookup shows up inside
    about half of all solutions.}
- {num: 2, track: core, name: Sliding window and binary search, why: Window problems test whether you can hold an invariant. Binary search on
    the answer is increasingly common at senior levels.}
- {num: 3, track: core, name: 'Linked lists, stacks and intervals', why: Pointer and ordering problems. Easy to describe and easy to get wrong
    under time pressure.}
- {num: 4, track: core, name: Trees, why: Traversal problems appear in a large share of classic rounds. Know the recursive and the iterative version
    of each.}
- {num: 5, track: core, name: Graphs, why: 'Grids, dependencies and weighted paths. Senior loops at large companies ask these often.'}
- {num: 6, track: core, name: Backtracking, why: Generate every option and prune. Interviewers watch how cleanly you structure the recursion.}
- {num: 7, track: core, name: Dynamic programming, why: 'Say the state in words first, then the transition. Google asks DP more than most companies.'}
- {num: 8, track: core, name: 'Greedy, math and bits', why: Short problems where the insight is the whole answer. Prove the greedy choice out
    loud.}
- {num: 9, track: core, name: Mixed hard problems, why: 'Harder problems that combine two patterns, which a large share of senior-level questions
    do. Finish the core phases first.'}
- {num: 10, track: practical, name: Build the primitives, why: Implement the structures you will compose in every later phase. No library collections
    for the core structure.}
- {num: 11, track: practical, name: Caches and ordered state, why: Hash map plus a second structure that keeps order. The most common practical-round
    pattern.}
- {num: 12, track: practical, name: 'Time, versions and rate limits', why: 'Timestamps, snapshots and expiry. This is the core of the in-memory
    database OA.'}
- {num: 13, track: practical, name: Heaps and scheduling, why: 'Priority queues, lazy deletion and event simulation. Dispatch and task-queue rounds
    live here.'}
- {num: 14, track: practical, name: 'Tries, strings and parsing', why: 'Prefix lookups, autocomplete and turning text rules into code.'}
- {num: 15, track: practical, name: Intervals and range queries, why: 'Booking, availability and delivery windows. Ordered maps, sweep lines and
    segment trees.'}
- {num: 16, track: practical, name: Trees and graphs, why: 'Hierarchies, dependencies and maps. BFS, DFS, topological sort, union-find and Dijkstra.'}
- {num: 17, track: practical, name: 'Iterators, streams and windows', why: Wrapping data sources and answering questions about the last N events.}
- {num: 18, track: practical, name: Multi-level systems, why: 'The CodeSignal Industry Coding format: one domain, requirements added in levels.'}
- {num: 19, track: practical, name: Concurrency, why: Staff loops often ask how your class behaves under concurrent callers. Practice the primitives.}
