progressions:
- slug: build-bank-system
  id: A
  title: Bank system
  base: Start from LC 2043
  time: 90 min
  levels:
  - {text: 'Accounts: create, deposit, withdraw, transfer. Reject invalid accounts and overdrafts.', staff: false}
  - {text: 'Transaction history per account, and top N accounts by total outgoing.', staff: false}
  - {text: 'Scheduled payments that execute at a timestamp, plus cancel. Process due payments before each operation.', staff: false}
  - {text: 'Merge two accounts while keeping balances, history and pending payments.', staff: false}
  - {text: 'Multi-currency balances, idempotent transfer IDs, and thread safety.', staff: true}
- slug: build-in-memory-database
  id: B
  title: In-memory database
  base: Start from LC 981 and 1146
  time: 90 min
  levels:
  - {text: 'set, get and delete on (key, field) records.', staff: false}
  - {text: 'scan(key) and scanByPrefix(key, prefix), sorted by field.', staff: false}
  - {text: 'TTL: values written with a lifetime disappear after it at query timestamp t.', staff: false}
  - {text: 'backup(t) and restore(t, backupT), recalculating remaining TTLs.', staff: false}
  - {text: 'Nested transactions with begin, commit and rollback.', staff: true}
- slug: build-cache-service
  id: C
  title: Cache service
  base: Start from LC 146, then 460
  time: 60 min
  levels:
  - {text: LRU cache with capacity., staff: false}
  - {text: Switch eviction policy to LFU behind the same interface., staff: false}
  - {text: Per-key TTL that is checked on read and swept periodically., staff: false}
  - {text: 'Hit rate and eviction metrics, then make the cache thread-safe.', staff: true}
- slug: build-file-system
  id: D
  title: File system
  base: Start from LC 1166, then 588
  time: 90 min
  levels:
  - {text: createPath and get with parent validation., staff: false}
  - {text: 'mkdir, ls, addContentToFile and readContentFromFile.', staff: false}
  - {text: 'File sizes, directory size, and the N largest files under a path.', staff: false}
  - {text: Users with storage quotas. Reject writes that exceed the quota., staff: false}
  - {text: Rename and move with locking. Discuss consistency during concurrent moves., staff: true}
- slug: build-delivery-dispatch
  id: E
  title: Delivery dispatch
  base: Builds on LC 1834, 3508, 2642, 986
  time: 90 min
  levels:
  - {text: Order intake queue with duplicate order IDs rejected., staff: false}
  - {text: Assign the oldest order to the available driver with the earliest free time., staff: false}
  - {text: Estimate ETAs with shortest paths over a road graph., staff: false}
  - {text: 'Driver pay for a pay period: base pay per delivery plus a rate for time spent on active orders, with overlapping orders counted once.',
    staff: false}
  - {text: 'Retries when a driver declines, and what changes at 10x order volume.', staff: true}
